name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod, cache: true}
      - name: Build artifacts
        run: make release VERSION=${GITHUB_REF_NAME#v}
      - name: Package artifacts
        run: |
          cd builds
          for binary in telegram-cli_*; do
            case "$binary" in *.sha256) continue;; esac
            tar -czf "$binary.tar.gz" "$binary" ../README.md ../LICENSE config.example.toml
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" builds/*.tar.gz builds/*.sha256 --generate-notes --verify-tag
